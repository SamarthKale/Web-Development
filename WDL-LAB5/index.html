<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Registration | Professional Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="form" class="form" novalidate>
            <div class="header">
                <h2>Create Account</h2>
                <p>Get started with your free account</p>
            </div>
            
            <div class="form-control">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="johndoe123" autocomplete="username">
                <i class="fas fa-check-circle"></i>
                <i class="fas fa-exclamation-circle"></i>
                <small>Error message</small>
            </div>

            <div class="form-control">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john@example.com" autocomplete="email">
                <small>Error message</small>
            </div>

            <div class="form-control">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="********" autocomplete="new-password">
                <small>Error message</small>
            </div>

            <div class="form-control">
                <label for="check-password">Confirm Password</label>
                <input type="password" id="check-password" placeholder="********" autocomplete="new-password">
                <small>Error message</small>
            </div>

            <button type="submit">Create Account</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
